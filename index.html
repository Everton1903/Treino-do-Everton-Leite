<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino do Everton - 30 Min</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0a0a0a;
            --card: #161616;
            --text: #ffffff;
            --rest: #ffcc00;
            --pause: #ff4b2b;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container { width: 100%; max-width: 450px; }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
        }

        .app-title { font-size: 1.1rem; color: var(--primary); text-transform: uppercase; }

        #totalTimer {
            font-size: 1.2rem;
            color: #fff;
            background: #333;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: monospace;
        }

        .exercise-card {
            background: var(--card);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .exercise-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #000;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
            display: block;
        }

        .timer-label { font-size: 1.1rem; margin-bottom: 5px; color: #888; text-transform: uppercase; }
        .timer-display { font-size: 6.5rem; font-weight: bold; margin: 5px 0; color: var(--primary); }

        select {
            width: 100%;
            padding: 15px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .description {
            background: #222;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

        button {
            padding: 20px;
            border-radius: 15px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        #startBtn { background: var(--primary); color: #000; width: 100%; grid-column: span 2; }
        #pauseBtn { background: var(--pause); color: #fff; display: none; width: 100%; grid-column: span 2; }
        
        .rest-mode { border-color: var(--rest); }
        .rest-mode .timer-display { color: var(--rest); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <div class="app-title">🔥 TREINO DO EVERTON</div>
            <div id="totalTimer">00:00</div>
        </div>
        
        <div class="exercise-card" id="card">
            <select id="exerciseSelect" onchange="atualizarDescricao()">
                <option data-info="Salte, caia em posição de flexão, toque o peito no chão e suba saltando.">1. Burpees</option>
                <option data-info="Posição de prancha, traga os joelhos ao peito alternando bem rápido.">2. Escalador</option>
                <option data-info="Agachamento explosivo: salte o mais alto que puder na subida.">3. Agachamento com Salto</option>
                <option data-info="Pule abrindo as pernas e elevando os braços acima da cabeça simultaneamente.">4. Polichinelos</option>
                <option data-info="Corpo reto, desça o peito até o chão e empurre com força.">5. Flexões</option>
                <option data-info="Na prancha, alterne entre apoiar as mãos e os cotovelos.">6. Prancha Dinâmica</option>
                <option data-info="Simule uma corrida sem sair do lugar, elevando bem os joelhos e movendo os braços.">7. Corrida Estacionária</option>
            </select>

            <img id="exerciseImg" src="https://images.unsplash.com/photo-1544033527-b192daee1f5b?q=80&w=1000&auto=format&fit=crop" alt="Calistenia" class="exercise-image">

            <div id="exerciseInfo" class="description">Aguardando início...</div>

            <div id="label" class="timer-label">PRONTO?</div>
            <div class="timer-display" id="timer">20</div>
            
            <div class="controls">
                <button id="startBtn" onclick="startWorkout()">Iniciar Treino</button>
                <button id="pauseBtn" onclick="togglePause()">Pausar</button>
            </div>
        </div>
    </div>

    <script>
        let countdown;
        let globalTimer;
        let totalSeconds = 0;
        let timeLeft = 20; 
        let isPaused = false;
        let isResting = false;
        let trainingActive = false;
        let wakeLock = null;
        let etapaConcluida = false;

        const timerDisplay = document.getElementById('timer');
        const totalTimerDisplay = document.getElementById('totalTimer');
        const label = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const exerciseSelect = document.getElementById('exerciseSelect');
        const exerciseInfo = document.getElementById('exerciseInfo');
        const card = document.getElementById('card');

        async function manterTelaAtiva() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock não suportado.");
            }
        }

        function atualizarDescricao() {
            const option = exerciseSelect.options[exerciseSelect.selectedIndex];
            exerciseInfo.innerText = option.getAttribute('data-info');
        }

        function falar(texto, callback) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(texto);
            msg.lang = 'pt-BR';
            msg.rate = 1.1;
            msg.onend = () => { if (!isPaused && callback) callback(); };
            window.speechSynthesis.speak(msg);
        }

        function startGlobalTimer() {
            if (trainingActive) return;
            trainingActive = true;
            globalTimer = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let mins = Math.floor(totalSeconds / 60);
                    let secs = totalSeconds % 60;
                    totalTimerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                    if (totalSeconds === 900 && !etapaConcluida) {
                        etapaConcluida = true;
                        togglePause();
                        falar("Primeira etapa de quinze minutos concluída. Respire, beba uma água e clique em retomar para a parte final.");
                    }

                    if (totalSeconds >= 1800) {
                        clearInterval(globalTimer);
                        clearInterval(countdown);
                        falar("Treino finalizado! Você completou os trinta minutos. Bom trabalho!");
                        trainingActive = false;
                    }
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? "Retomar" : "Pausar";
            pauseBtn.style.background = isPaused ? "var(--primary)" : "var(--pause)";
            pauseBtn.style.color = isPaused ? "#000" : "#fff";
            if (!isPaused) {
                falar("Retomando.");
            } else {
                window.speechSynthesis.cancel();
            }
        }

        function startWorkout() {
            manterTelaAtiva();
            startGlobalTimer();
            startBtn.style.display = "none";
            pauseBtn.style.display = "block";
            executarCiclo();
        }

        function executarCiclo() {
            if (totalSeconds >= 1800) return;
            isResting = false;
            const option = exerciseSelect.options[exerciseSelect.selectedIndex];
            const sinopse = option.getAttribute('data-info');
            
            atualizarDescricao();
            label.innerText = "PREPARAR...";
            
            // Fala o nome do exercício e a explicação (sinopse) antes de começar os 20s
            falar("Exercício: " + option.text + ". " + sinopse + ". Começando agora!", () => {
                timeLeft = 20;
                iniciarContagem(() => iniciarDescanso());
            });
        }

        function iniciarDescanso() {
            if (totalSeconds >= 1800) return;
            isResting = true;
            falar("Tempo esgotado. Descanse quarenta segundos.", () => {
                timeLeft = 40;
                iniciarContagem(() => {
                    proximoExercicio();
                    executarCiclo();
                });
            });
        }

        function proximoExercicio() {
            let nextIndex = exerciseSelect.selectedIndex + 1;
            if (nextIndex >= exerciseSelect.options.length) nextIndex = 0;
            exerciseSelect.selectedIndex = nextIndex;
        }

        function iniciarContagem(callback) {
            if (countdown) clearInterval(countdown);
            label.innerText = isResting ? "DESCANSO" : "TREINANDO";
            if(isResting) card.classList.add('rest-mode'); else card.classList.remove('rest-mode');

            countdown = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        callback();
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
